<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI Mastery Workshop</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="base-theme" />
    <link rel="stylesheet" href="theme.css?v=36" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <!--
          Each section of the workshop is one markdown file in the slides folder.
          A slide break is a line with three dashes. Speaker notes start with a line that says Note:.
          Always leave a blank line after any raw HTML tag so the markdown below it is parsed.
        -->
        <section data-markdown="slides/title.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-02-credibility.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-03-topics.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-04-ai-basics.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-05-comet.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-06-prompting.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-07-custom-gpts.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-08-claude-build.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-09-openclaw.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-10-heygen.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-11-n8n.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-12-selling.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
        <section data-markdown="slides/section-13-closing.md?v=36" data-separator="^\r?\n---\r?\n$" data-separator-notes="^Note:"></section>
      </div>

      <!-- brand footer, fixed on every slide -->
      <div class="brand-footer">AI Mastery Workshop</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/markdown/markdown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/notes/notes.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/highlight.js"></script>
    <script src="agent-demo.js"></script>
    <script src="gpt-builder-demo.js?v=36"></script>
    <script src="vibe-demo.js?v=36"></script>
    <script src="automation-demo.js?v=36"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/plugin/highlight/monokai.css" />
    <script>
      Reveal.initialize({
        hash: true,
        slideNumber: 'c/t',
        transition: 'slide',
        transitionSpeed: 'fast',
        controls: false,
        controlsTutorial: false,
        progress: true,
        center: true,
        margin: 0.08,
        width: 1280,
        height: 720,
        plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
      }).then(function () { addCopyButtons(); initAgentDemos(); initGptBuilderDemos(); initVibeDemos(); initAutomationDemos(); });

      // Adds a "Copy" button to every prompt block (.codecard) so the
      // presenter can copy the exact prompt text to the clipboard live.
      function addCopyButtons() {
        document.querySelectorAll('.reveal .codecard').forEach(function (card) {
          if (card.querySelector('.copy-btn')) return;
          var bar = card.querySelector('.cc-bar');
          var codeEl = card.querySelector('pre code');
          if (!bar || !codeEl) return;

          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'copy-btn';
          btn.textContent = 'Copy';
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var text = codeEl.innerText;
            navigator.clipboard.writeText(text).then(function () {
              btn.textContent = 'Copied!';
              btn.classList.add('copied');
              setTimeout(function () {
                btn.textContent = 'Copy';
                btn.classList.remove('copied');
              }, 1500);
            });
          });
          bar.appendChild(btn);
        });
      }
    </script>
  </body>
</html>
